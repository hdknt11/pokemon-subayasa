<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boltglow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.5"/>

  <!-- Speed arc lines -->
  <g opacity="0.35" stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
    <path d="M 80 180 Q 140 160 160 200" fill="none"/>
    <path d="M 70 230 Q 130 210 148 252" fill="none"/>
    <path d="M 80 280 Q 138 265 152 305" fill="none"/>
  </g>

  <!-- Lightning bolt -->
  <g filter="url(#boltglow)">
    <polygon
      points="290,90 190,270 248,270 222,420 340,230 278,230"
      fill="url(#bolt)"
      stroke="#fef9c3"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>

  <!-- Shine on bolt -->
  <polygon
    points="280,110 245,210 265,210"
    fill="white"
    opacity="0.25"
  />
</svg>
